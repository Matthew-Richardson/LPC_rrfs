name: Update RRFS and publish map

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '35 * * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: rrfs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install forecast decoder
        run: python -m pip install -r requirements.txt
      - name: Verify data processing
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify watershed averages
        run: node --test tests/basin-math.test.cjs
      - name: Restore last complete forecast
        uses: actions/cache/restore@v4
        with:
          path: data
          key: rrfs-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rrfs-v1-
      - name: Download latest complete 84-hour cycle
        run: python scripts/update_rrfs.py
      - name: Save complete forecast
        uses: actions/cache/save@v4
        with:
          path: data
          key: rrfs-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Assemble static website
        run: |
          mkdir -p _site
          cp index.html styles.css app.js basin-math.js _site/
          cp -r assets data _site/
          touch _site/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: LPC-RRFS-static-site
          path: _site/
          retention-days: 7
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for source-only Pages publishing
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            // A repository using branch-based Pages can start its own source-only
            // build on this push. Publish the complete forecast after it finishes.
            for (let attempt = 0; attempt < 60; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                head_sha: context.sha, per_page: 100
              });
              const legacy = data.workflow_runs.filter(run =>
                run.name === 'pages build and deployment' && run.id !== context.runId);
              if (!legacy.some(run => run.status !== 'completed')) return;
              core.info('Waiting for the branch-based Pages deployment to finish');
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Source-only Pages deployment did not finish; refusing a publication race');
      - name: Deploy map
        id: deployment
        uses: actions/deploy-pages@v4
